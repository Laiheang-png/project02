<!doctype html>
<html lang="km">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visual Order Reordering</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #0f172a;
        color: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
      }
      h1 {
        margin-bottom: 20px;
      }
      .container {
        display: flex;
        gap: 15px;
        background-color: #1e293b;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      }
      .item {
        width: 60px;
        height: 60px;
        background-color: #3b82f6;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        font-weight: bold;
        border-radius: 6px;
      }
      .item-1 {
        order: 3;
      }
      .item-2 {
        order: 2;
      }
      .item-3 {
        order: 4;
      }
      .item-4 {
        order: 1;
        background-color: #ef4444; /* ដាក់ពណ៌ខុសគេបន្តិចដើម្បីស្រួលមើល */
      }
    </style>
  </head>
  <body>
    <h1>Visual Order Reordering</h1>
    <div class="container">
      <div class="item item-1">1</div>
      <div class="item item-2">2</div>
      <div class="item item-3">3</div>
      <div class="item item-4">4</div>
    </div>
  </body>
</html>
