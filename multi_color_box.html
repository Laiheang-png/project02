<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multi Color Box</title>
    <style>
      .container {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-around;
        gap: 15px;
      }
      .container > div {
        width: 200px;
        height: 100px;
        border-radius: 8px;
      }
      .box-1 {
        background: blue;
      }
      .box-2 {
        background: blueviolet;
      }
      .box-3 {
        background: orangered;
      }
      .box-4 {
        background: yellowgreen;
      }
      .box-5 {
        background: sandybrown;
      }
      .box-6 {
        background: gray;
      }
    </style>
  </head>
  <body>
    <h1>Multi Color Box</h1>
    <div class="container">
      <div class="box-1"></div>
      <div class="box-2"></div>
      <div class="box-3"></div>
      <div class="box-4"></div>
      <div class="box-5"></div>
      <div class="box-6"></div>
    </div>
  </body>
</html>
