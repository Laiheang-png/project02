<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>flex wrap & flex flow</title>
    <style>
      .container {
        display: flex;
        flex-flow: row wrap;
        gap: 15px;
      }
      .item {
        padding: 1rem 1.5rem;
        background: #cae007;
        color: white;
        margin: 5px;
        width: 180px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="item">Item 1</div>
      <div class="item">Item 2</div>
      <div class="item">Item 3</div>
      <div class="item">Item 4</div>
      <div class="item">Item 5</div>
      <div class="item">Item 6</div>
    </div>
  </body>
</html>
