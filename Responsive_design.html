<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Design</title>
    <style>
      .flex-container {
        display: flex;
        flex-direction: row;
        gap: 15px;
      }
      @media (max-width: 600px) {
        .flex-container {
          flex-direction: column; /* ប្តូរទៅជួរឈរលើអេក្រង់តូច */
        }
      }
    </style>
  </head>
  <body>
    <h1>Responsive Design Example</h1>
    <div class="flex-container">
      <div style="background-color: lightblue; padding: 20px; flex: 1">
        Box 1
      </div>
      <div style="background-color: lightcoral; padding: 20px; flex: 1">
        Box 2
      </div>
      <div style="background-color: lightgreen; padding: 20px; flex: 1">
        Box 3
      </div>
    </div>
  </body>
</html>
