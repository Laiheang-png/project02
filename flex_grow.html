<!doctype html>
<html lang="km">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flex Grow សមាមាត្រ (1, 1, 8)</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #0f172a;
        color: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
      }

      h1 {
        margin-bottom: 20px;
      }

      .container {
        display: flex;
        width: 100%;
        max-width: 800px;
        gap: 10px;
        background-color: #1e293b;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        box-sizing: border-box;
      }

      .item {
        height: 60px;
        background-color: #3b82f6;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        font-weight: bold;
        border-radius: 6px;
      }
      .item-1 {
        flex-grow: 1;
      }
      .item-2 {
        flex-grow: 1;
      }
      .item-3 {
        flex-grow: 8;
        background-color: #10b981;
      }
    </style>
  </head>
  <body>
    <h1>Flex Grow សមាមាត្រ (1, 1, 8)</h1>

    <div class="container">
      <div class="item item-1">1</div>
      <div class="item item-2">2</div>
      <div class="item item-3">3</div>
    </div>
  </body>
</html>
