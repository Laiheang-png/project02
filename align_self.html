<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Align Self</title>
    <style>
      .container {
        display: flex;
        height: 200px;
        align-items: center;
      }
      .special-item {
        align-self: flex-end; /* រត់ទៅបាតក្រោមតែឯង */
      }
      .container > .card {
        flex: 1;
        background: #0e4bda;
        border: 1px solid #2152c4;
        border-radius: 10px;
        padding: 20px;
        min-height: 120px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">Card 1</div>
      <div class="card special-item">Special Card</div>
      <div class="card">Card 3</div>
    </div>
  </body>
</html>
