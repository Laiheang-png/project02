<!doctype html>
<html lang="km">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flex Shrink ការពារ Logo</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #0f172a;
        color: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
      }

      h1 {
        margin-bottom: 20px;
      }

      /* Container សម្រាប់ធ្វើ Header ឬ Navbar */
      .header-container {
        display: flex;
        align-items: center;
        gap: 15px;
        width: 100%;
        max-width: 600px;
        background-color: #1e293b;
        padding: 15px;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        box-sizing: border-box;
      }

      /* --- CSS Flex Shrink Rules (Lab 10) --- */
      .logo {
        flex-shrink: 0; /* ដាច់ខាតមិនឱ្យតូចជាង 160px */
        width: 160px;
        height: 40px;
        background-color: #ef4444;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        border-radius: 6px;
      }

      .search-input {
        flex-shrink: 1; /* រួញទំហំបាននៅពេលអេក្រង់តូច */
        flex-grow: 1; /* រីកធំពេញ space ទំនេរ */
        height: 40px;
        padding: 0 15px;
        background-color: #334155;
        border: 1px solid #475569;
        border-radius: 6px;
        color: white;
        font-size: 14px;
        outline: none;
        box-sizing: border-box;
      }

      .search-input::placeholder {
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <h1>Flex Shrink ការពារ Logo</h1>
    <div class="header-container">
      <div class="logo">MY LOGO</div>
      <input type="text" class="search-input" placeholder="Search here..." />
    </div>
  </body>
</html>
